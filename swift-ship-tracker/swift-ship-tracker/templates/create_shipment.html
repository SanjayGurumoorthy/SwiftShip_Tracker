{% extends 'base.html' %}{% block title %}New Shipment{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">SHIPMENT MANAGEMENT</p><h1>Create Shipment</h1></div></div><form class="form-card wide" method="post"><div class="grid2"><label>Sender Name<input name="sender_name" required></label><label>Sender Phone<input name="sender_phone" required></label><label>Receiver Name<input name="receiver_name" required></label><label>Receiver Phone<input name="receiver_phone" required></label><label>Pickup Address<textarea name="pickup_address" required></textarea></label><label>Delivery Address<textarea name="delivery_address" required></textarea></label><label>Package Description<input name="package_description" required></label><label>Weight (kg)<input type="number" step="0.1" min="0.1" name="weight" required></label></div><button class="btn">Create Shipment</button></form>{% endblock %}
